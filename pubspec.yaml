name: relay
description: "A modern, cross-platform API testing client built with Flutter."
publish_to: 'none'
version: 1.0.0+2
repository: https://github.com/role-suite/role-client
issue_tracker: https://github.com/role-suite/role-client/issues

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  file_picker: ^10.3.7
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.0.3
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2
  html: ^0.15.6
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.0
  path_provider_platform_interface: ^2.1.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/image/app_logo_rounded.png"
  image_path_ios: "assets/image/app_logo_rounded.png"
  adaptive_icon_foreground: "assets/image/app_logo_rounded.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/image/app_logo_rounded.png"
  macos:
    generate: true
    image_path: "assets/image/app_logo_rounded.png"

flutter:
  uses-material-design: true
  assets:
    - assets/image/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
