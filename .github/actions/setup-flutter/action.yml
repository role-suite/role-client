name: Setup Flutter
description: Install the Flutter SDK pinned in .fvmrc and fetch pub dependencies.

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .fvmrc
        channel: stable
        cache: true
        pub-cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile
