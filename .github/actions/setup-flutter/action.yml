name: Setup Flutter
description: Install the Flutter SDK pinned in .fvmrc and fetch pub dependencies.

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: .fvmrc
        channel: stable
        cache: true
        pub-cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile
