name: CI Analyze

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Configure Flutter (no Web)
        run: flutter config --no-enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings
