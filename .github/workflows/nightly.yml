name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  drift:
    name: Latest stable Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Deliberately not the shared setup-flutter action: this job checks the
      # toolchain against the newest stable SDK, ignoring the .fvmrc pin.
      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

  report-failure:
    name: Open or update drift issue
    needs: drift
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly Flutter drift check is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The nightly check against the latest stable Flutter SDK failed.',
              '',
              `- Commit: \`${context.sha}\``,
              `- Run: ${runUrl}`,
              '',
              'This usually means a Flutter/Dart upgrade breaks the pinned toolchain. Investigate,',
              'then bump `.fvmrc` (and any affected dependencies) deliberately.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
