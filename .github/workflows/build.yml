name: Build

# Reusable build workflow. `build-check.yml` calls it with every platform to
# verify compilation on PRs; `release.yml` calls it with the desktop platforms,
# signing enabled, and packaging on. Keeping the platform build logic here means
# the artifacts a release publishes are produced by the same steps CI verifies.

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of platforms to build (windows, linux, macos, android, android-aab, ios)
        required: true
        type: string
      ref:
        description: Git ref to check out (defaults to the triggering commit)
        required: false
        default: ""
        type: string
      sign:
        description: Sign Windows builds when the certificate secret is configured
        required: false
        default: false
        type: boolean
      package:
        description: Package and upload release archives
        required: false
        default: false
        type: boolean
    secrets:
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      MACOS_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_PROVISIONING_PROFILE_BASE64:
        required: false
      APP_STORE_CONNECT_API_KEY_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    # `include` entries in a matrix create their own combinations, so the
    # platform list has to drive name/os via expressions — otherwise every
    # platform would always build regardless of the requested list.
    name: >-
      ${{ matrix.platform == 'windows' && 'Windows'
      || matrix.platform == 'linux' && 'Linux'
      || matrix.platform == 'macos' && 'macOS (unsigned)'
      || matrix.platform == 'android' && 'Android'
      || matrix.platform == 'android-aab' && 'Android (AAB)'
      || 'iOS (no codesign)' }}
    runs-on: >-
      ${{ matrix.platform == 'windows' && 'windows-latest'
      || (matrix.platform == 'macos' || matrix.platform == 'ios') && 'macos-latest'
      || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Cache Gradle
        if: matrix.platform == 'android' || matrix.platform == 'android-aab'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: ./.github/actions/setup-flutter

      # Gradle installs the NDK on first use, and a single corrupted download
      # fails the whole build during configuration (seen in practice). Install
      # it up front with retries, reading the exact version Flutter expects.
      - name: Preinstall Android NDK
        if: matrix.platform == 'android' || matrix.platform == 'android-aab'
        run: |
          ndk_version=$(grep -oP 'val ndkVersion: String = "\K[0-9.]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" | head -1)
          if [ -z "$ndk_version" ]; then
            echo "Could not determine the NDK version from the Flutter SDK; letting Gradle install it."
            exit 0
          fi
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if yes | "$sdkmanager" --install "ndk;$ndk_version" > /tmp/ndk-install.log 2>&1; then
              echo "Installed Android NDK $ndk_version."
              exit 0
            fi
            echo "Attempt $attempt to install NDK $ndk_version failed; clearing the partial download and retrying."
            rm -rf "$ANDROID_HOME/ndk/$ndk_version" "$ANDROID_HOME/.temp"
            sleep 5
          done
          echo "::error::Failed to install Android NDK $ndk_version after 3 attempts."
          tail -50 /tmp/ndk-install.log
          exit 1

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      # The Xcode project uses automatic signing with a development team, which
      # is not available on CI runners. Flutter only disables signing itself for
      # iOS, so force an unsigned build for the macOS compile check.
      - name: Build macOS (unsigned)
        if: matrix.platform == 'macos'
        run: flutter build macos --release
        env:
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"

      # Release builds are signed with the Developer ID identity and notarized
      # so Gatekeeper opens them without a warning. The build above stays
      # unsigned (works for PR compile checks, and macOS builds are faster to
      # sign once, at the end, than to configure Xcode's signing for CI).
      - name: Sign and notarize macOS build
        if: inputs.sign && inputs.package && matrix.platform == 'macos' && env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app)
          bash packaging/macos/sign_and_notarize.sh "$app" macos/Runner/Release.entitlements "$GITHUB_WORKSPACE/relay-macos.zip"

      - name: Build Android
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Configure Android signing
        if: inputs.sign && matrix.platform == 'android-aab' && env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle
        if: matrix.platform == 'android-aab'
        run: flutter build appbundle --release

      - name: Build iOS (no codesign)
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Sign Windows executable
        if: inputs.sign && matrix.platform == 'windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          & $signtool sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "build\windows\x64\runner\Release\relay.exe"
          Remove-Item certificate.pfx

      - name: Package Windows build
        if: inputs.package && matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath relay-windows.zip

      - name: Upload Windows artifact
        if: inputs.package && matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: relay-windows.zip
          retention-days: 7

      # Inno Setup is preinstalled on GitHub's Windows runners. The installer
      # is what the in-app updater downloads and runs silently.
      - name: Build Windows installer
        if: inputs.package && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*' } | Select-Object -First 1
          $version = (($line -split '\s+')[1] -split '\+')[0]
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=$version" packaging\windows\relay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item build\windows\installer\relay-windows-setup.exe "relay-$version-windows-x64-setup.exe"

      - name: Sign Windows installer
        if: inputs.sign && matrix.platform == 'windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          $installer = (Get-ChildItem -Path "build\windows\installer" -Filter "relay-*-windows-x64-setup.exe" | Select-Object -First 1).FullName
          & $signtool sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item certificate.pfx

      - name: Verify Windows signatures
        if: inputs.sign && matrix.platform == 'windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $targets = @(
            "build\windows\x64\runner\Release\relay.exe",
            (Get-ChildItem -Path "build\windows\installer" -Filter "relay-*-windows-x64-setup.exe" | Select-Object -First 1).FullName
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            if ($signature.Status -ne 'Valid') {
              Write-Error "$target signature is not valid: $($signature.Status)"
              exit 1
            }
            Write-Host "$target signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Upload Windows installer
        if: inputs.package && matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-release
          path: build/windows/installer/relay-*-windows-x64-setup.exe
          retention-days: 7

      - name: Package Linux build
        if: inputs.package && matrix.platform == 'linux'
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/relay
          tar -czf relay-linux.tar.gz -C build/linux/x64/release relay

      - name: Upload Linux artifact
        if: inputs.package && matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: relay-linux.tar.gz
          retention-days: 7

      # An AppImage wraps the same bundle in a single executable that can
      # replace itself, which is what the in-app updater relies on. Run with
      # --appimage-extract-and-run so no FUSE is needed on the runner.
      - name: Build Linux AppImage
        if: inputs.package && matrix.platform == 'linux'
        run: |
          version=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml | head -1)
          APPDIR=build/linux/AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r build/linux/x64/release/relay/* "$APPDIR/usr/bin/"
          cp assets/image/app_logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/relay.png"
          cp assets/image/app_logo.png "$APPDIR/relay.png"
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/relay" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          printf '[Desktop Entry]\nName=Röle\nExec=relay\nIcon=relay\nType=Application\nCategories=Development;\n' > "$APPDIR/relay.desktop"
          curl -sL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run --no-appstream "$APPDIR" "relay-$version-x86_64.AppImage"

      - name: Upload Linux AppImage
        if: inputs.package && matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage-release
          path: relay-*-x86_64.AppImage
          retention-days: 7

      - name: Package Android AAB
        if: inputs.package && matrix.platform == 'android-aab'
        run: cp build/app/outputs/bundle/release/app-release.aab relay-android.aab

      - name: Upload Android AAB artifact
        if: inputs.package && matrix.platform == 'android-aab'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab-release
          path: relay-android.aab
          retention-days: 7

      - name: Package Android APK
        if: inputs.package && matrix.platform == 'android'
        run: cp build/app/outputs/flutter-apk/app-release.apk relay-android.apk

      - name: Upload Android APK artifact
        if: inputs.package && matrix.platform == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk-release
          path: relay-android.apk
          retention-days: 7

      - name: Package macOS build (unsigned)
        if: inputs.package && matrix.platform == 'macos' && (!inputs.sign || env.HAS_MAC_SIGNING != 'true')
        run: |
          cd build/macos/Build/Products/Release
          app=$(ls -d *.app)
          zip -qry "$GITHUB_WORKSPACE/relay-macos.zip" "$app"

      - name: Upload macOS artifact
        if: inputs.package && matrix.platform == 'macos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: relay-macos.zip
          retention-days: 7

      - name: Package iOS build (unsigned)
        if: inputs.package && matrix.platform == 'ios'
        run: |
          cd build/ios/iphoneos
          app=$(ls -d *.app)
          zip -qry "$GITHUB_WORKSPACE/relay-ios-unsigned.zip" "$app"

      - name: Upload iOS artifact
        if: inputs.package && matrix.platform == 'ios'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release
          path: relay-ios-unsigned.zip
          retention-days: 7
