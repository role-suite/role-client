name: Build

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_NUMBER: ${{ github.run_number }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Configure Flutter (Linux, no Web)
        run: flutter config --enable-linux-desktop --no-enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package artifact
        run: |
          tar -cJf build/linux/x64/release/role-linux-x64.tar.xz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: role-linux-x64
          path: build/linux/x64/release/role-linux-x64.tar.xz
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Configure Flutter (Windows, no Web)
        run: flutter config --enable-windows-desktop --no-enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/Release/role-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: role-windows-x64
          path: build/windows/x64/runner/Release/role-windows-x64.zip
          retention-days: 30

  build-macos-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Configure Flutter (macOS, no Web)
        run: flutter config --enable-macos-desktop --no-enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package artifact
        run: |
          cd build/macos/Build/Products/Release
          zip -r role-macos-arm64.zip relay.app

      - uses: actions/upload-artifact@v4
        with:
          name: role-macos-arm64
          path: build/macos/Build/Products/Release/role-macos-arm64.zip
          retention-days: 30

  build-android-apk:
    name: Build Android (APK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Flutter (Android, no Web)
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter config --no-enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: role-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-android-aab:
    name: Build Android (AAB)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Flutter (Android, no Web)
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter config --no-enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: role-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  
