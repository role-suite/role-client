name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build matrix
    uses: ./.github/workflows/build.yml
    with:
      platforms: '["windows","linux","macos","android","ios"]'
      # Package on PRs too, so installer/AppImage packaging can never break
      # silently between releases.
      package: true
