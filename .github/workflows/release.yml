name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and publish, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-version:
    name: Verify tag matches pubspec and main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter

      - name: Check tag against pubspec.yaml
        run: dart run tool/version.dart validate --tag "$RELEASE_TAG"

      - name: Check tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "::error::$RELEASE_TAG is not an ancestor of main; release tags must be created on main"
            exit 1
          fi

  preflight:
    name: Determine platforms
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Decide platform list
        id: platforms
        env:
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          # GitHub Releases get an installable APK; the AAB is only built when the
          # Google Play service account is configured, since that is its only use.
          platforms='["windows","linux","macos","android","ios"'
          if [ "$HAS_PLAY" = "true" ]; then
            platforms="$platforms"',"android-aab"'
          fi
          echo "platforms=$platforms]" >> "$GITHUB_OUTPUT"

  build:
    name: Build release artifacts
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      platforms: ${{ needs.preflight.outputs.platforms }}
      ref: ${{ inputs.tag || github.ref }}
      sign: true
      package: true
    secrets: inherit

  create-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp artifacts/windows-release/relay-windows.zip "release-assets/relay-${VERSION}-windows-x64.zip"
          cp artifacts/windows-installer-release/relay-${VERSION}-windows-x64-setup.exe "release-assets/relay-${VERSION}-windows-x64-setup.exe"
          cp artifacts/linux-release/relay-linux.tar.gz "release-assets/relay-${VERSION}-linux-x64.tar.gz"
          cp artifacts/linux-appimage-release/relay-${VERSION}-x86_64.AppImage "release-assets/relay-${VERSION}-x86_64.AppImage"
          cp artifacts/macos-release/relay-macos.zip "release-assets/relay-${VERSION}-macos.zip"
          cp artifacts/android-apk-release/relay-android.apk "release-assets/relay-${VERSION}-android.apk"
          cp artifacts/ios-release/relay-ios-unsigned.zip "release-assets/relay-${VERSION}-ios-unsigned.zip"

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum relay-* > SHA256SUMS

      # Attached so package-manager manifests stay in lockstep with each
      # release without hardcoding versions in the repo. See
      # docs/11-PACKAGE-MANAGERS.md for the publishing paths (tap/bucket/
      # winget-pkgs submission).
      - name: Generate package-manager manifests
        run: |
          VERSION="${RELEASE_TAG#v}"
          cd release-assets
          mac_sha=$(awk -v n="relay-${VERSION}-macos.zip" '$2 == n { print $1 }' SHA256SUMS)
          win_zip_sha=$(awk -v n="relay-${VERSION}-windows-x64.zip" '$2 == n { print $1 }' SHA256SUMS)
          win_setup_sha=$(awk -v n="relay-${VERSION}-windows-x64-setup.exe" '$2 == n { print $1 }' SHA256SUMS)
          base="https://github.com/role-suite/role-client/releases/download/v${VERSION}"

          cat > role.rb <<EOF
          cask "role" do
            version "${VERSION}"
            sha256 "${mac_sha}"

            url "${base}/relay-#{version}-macos.zip"
            name "Röle"
            desc "Local-first cross-platform API client"
            homepage "https://github.com/role-suite/role-client"

            app "Runner.app", target: "Röle.app"
          end
          EOF

          python3 - <<PY
          import json

          manifest = {
              "version": "${VERSION}",
              "description": "Local-first cross-platform API client",
              "homepage": "https://github.com/role-suite/role-client",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "${base}/relay-${VERSION}-windows-x64.zip",
                      "hash": "${win_zip_sha}",
                  }
              },
              "bin": "relay.exe",
              "shortcuts": [["relay.exe", "Röle"]],
              "checkver": {"github": "https://github.com/role-suite/role-client"},
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/role-suite/role-client/releases/download/v\$version/relay-\$version-windows-x64.zip"
                      }
                  }
              },
          }
          with open("role.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          mkdir -p winget
          cat > winget/RoleSuite.Role.yaml <<EOF
          PackageIdentifier: RoleSuite.Role
          PackageVersion: ${VERSION}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          EOF
          cat > winget/RoleSuite.Role.installer.yaml <<EOF
          PackageIdentifier: RoleSuite.Role
          PackageVersion: ${VERSION}
          InstallerType: inno
          Installers:
            - Architecture: x64
              InstallerUrl: ${base}/relay-${VERSION}-windows-x64-setup.exe
              InstallerSha256: ${win_setup_sha}
              InstallerSwitches:
                Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
                SilentWithProgress: /SILENT
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF
          cat > winget/RoleSuite.Role.locale.en-US.yaml <<EOF
          PackageIdentifier: RoleSuite.Role
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: Röle
          PackageName: Röle
          License: MIT
          ShortDescription: Local-first cross-platform API client
          Moniker: role
          Tags:
            - api
            - api-client
            - rest
            - developer-tools
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF
          (cd winget && zip -qry ../relay-winget-manifests.zip .)
          rm -rf winget

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/relay-*

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
          draft: true

  publish-release:
    name: Publish release
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  play-upload:
    name: Upload to Google Play (internal)
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check release signing prerequisites
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true' && env.HAS_ANDROID_KEYSTORE != 'true'
        run: |
          echo "::error::PLAY_SERVICE_ACCOUNT_JSON is configured but ANDROID_KEYSTORE_BASE64 is not; the AAB would be debug-signed and rejected by Google Play."
          exit 1

      - name: Download AAB
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-aab-release
          path: android

      - name: Upload to Google Play internal track
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.devora.relay
          releaseFiles: android/relay-android.aab
          track: internal
          status: completed

  ios-testflight:
    name: Upload to TestFlight
    needs: publish-release
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_IOS_SIGNING: ${{ secrets.MATCH_GIT_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Note skipped upload
        if: env.HAS_IOS_SIGNING != 'true'
        run: echo "::notice::MATCH_GIT_URL is not configured; skipping the TestFlight upload."

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: env.HAS_IOS_SIGNING == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: ./.github/actions/setup-flutter
        if: env.HAS_IOS_SIGNING == 'true'

      - name: Build and upload to TestFlight
        if: env.HAS_IOS_SIGNING == 'true'
        working-directory: ios
        env:
          CI: "true"
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_USERNAME: ${{ secrets.MATCH_USERNAME }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: bundle exec fastlane beta
