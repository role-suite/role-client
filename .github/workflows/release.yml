name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout role-sdk
        uses: actions/checkout@v4
        with:
          repository: role-suite/role-sdk
          path: role-sdk
          token: ${{ secrets.ROLE_SDK_REPO_TOKEN || github.token }}

      - name: Create role_sdk override
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            role_sdk:
              path: role-sdk/generated/dart/role_sdk
          EOF

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Configure Flutter (no Web)
        run: flutter config --no-enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout role-sdk
        uses: actions/checkout@v4
        with:
          repository: role-suite/role-sdk
          path: role-sdk
          token: ${{ secrets.ROLE_SDK_REPO_TOKEN || github.token }}

      - name: Create role_sdk override
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            role_sdk:
              path: role-sdk/generated/dart/role_sdk
          EOF

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Configure Flutter (no Web)
        run: flutter config --no-enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter=expanded

  prepare-version:
    name: Prepare Version
    needs:
      - analyze
      - test
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute release version
        id: version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re

          pubspec = pathlib.Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?\s*$", pubspec, re.MULTILINE)
          if not match:
            raise SystemExit("Could not parse version from pubspec.yaml")

          major, minor, _patch, _build = match.groups()
          run_number = "${{ github.run_number }}"

          app_version = f"{major}.{minor}.{run_number}"
          build_number = run_number

          print(f"app_version={app_version}")
          print(f"build_number={build_number}")
          print(f"tag=v{app_version}")
          print(f"release_name=Release v{app_version}")
          PY

  build-all:
    name: Build All Platforms
    needs: prepare-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-22.04
          - platform: windows
            runs-on: windows-2022
          - platform: macos-arm
            runs-on: macos-14
          - platform: android-apk
            runs-on: ubuntu-22.04
          - platform: android-aab
            runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Checkout role-sdk
        uses: actions/checkout@v4
        with:
          repository: role-suite/role-sdk
          path: role-sdk
          token: ${{ secrets.ROLE_SDK_REPO_TOKEN || github.token }}

      - name: Create role_sdk override (non-Windows)
        if: runner.os != 'Windows'
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            role_sdk:
              path: role-sdk/generated/dart/role_sdk
          EOF

      - name: Create role_sdk override (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @"
          dependency_overrides:
            role_sdk:
              path: role-sdk/generated/dart/role_sdk
          "@ | Set-Content pubspec_overrides.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache-key: flutter-{{ .Os }}-{{ .Version }}
          cache-path: ${{ runner.temp }}/flutter

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Configure Flutter (Linux, no Web)
        if: matrix.platform == 'linux'
        run: flutter config --enable-linux-desktop --no-enable-web

      - name: Configure Flutter (Windows, no Web)
        if: matrix.platform == 'windows'
        run: flutter config --enable-windows-desktop --no-enable-web

      - name: Configure Flutter (macOS, no Web)
        if: matrix.platform == 'macos-arm'
        run: flutter config --enable-macos-desktop --no-enable-web

      - name: Configure Flutter (Android, no Web)
        if: matrix.platform == 'android-apk' || matrix.platform == 'android-aab'
        run: flutter config --no-enable-web

      - name: Set up Java 17
        if: matrix.platform == 'android-apk' || matrix.platform == 'android-aab'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Flutter JDK (Android)
        if: matrix.platform == 'android-apk' || matrix.platform == 'android-aab'
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release --build-name="${{ needs.prepare-version.outputs.app_version }}" --build-number="${{ needs.prepare-version.outputs.build_number }}"
          tar -cJf build/linux/x64/release/role-linux-x64.tar.xz -C build/linux/x64/release/bundle .

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --build-name="${{ needs.prepare-version.outputs.app_version }}" --build-number="${{ needs.prepare-version.outputs.build_number }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/Release/role-windows-x64.zip

      - name: Build macOS ARM
        if: matrix.platform == 'macos-arm'
        run: |
          flutter build macos --release --build-name="${{ needs.prepare-version.outputs.app_version }}" --build-number="${{ needs.prepare-version.outputs.build_number }}"
          cd build/macos/Build/Products/Release
          zip -r role-macos-arm64.zip relay.app

      - name: Build Android APK
        if: matrix.platform == 'android-apk'
        run: flutter build apk --release --build-name="${{ needs.prepare-version.outputs.app_version }}" --build-number="${{ needs.prepare-version.outputs.build_number }}"

      - name: Build Android AAB
        if: matrix.platform == 'android-aab'
        run: flutter build appbundle --release --build-name="${{ needs.prepare-version.outputs.app_version }}" --build-number="${{ needs.prepare-version.outputs.build_number }}"

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: build/linux/x64/release/role-linux-x64.tar.xz

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/windows/x64/runner/Release/role-windows-x64.zip

      - name: Upload macOS ARM artifact
        if: matrix.platform == 'macos-arm'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: build/macos/Build/Products/Release/role-macos-arm64.zip

      - name: Upload Android APK artifact
        if: matrix.platform == 'android-apk'
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android AAB artifact
        if: matrix.platform == 'android-aab'
        uses: actions/upload-artifact@v4
        with:
          name: release-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  create-release:
    name: Create Release
    needs:
      - prepare-version
      - build-all
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare-version.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/release-linux/role-linux-x64.tar.xz
            artifacts/release-windows/role-windows-x64.zip
            artifacts/release-macos-arm64/role-macos-arm64.zip
            artifacts/release-android-apk/app-release.apk
            artifacts/release-android-aab/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
