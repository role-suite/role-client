name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and publish, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-version:
    name: Verify tag matches pubspec and main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter

      - name: Check tag against pubspec.yaml
        run: dart run tool/version.dart validate --tag "$RELEASE_TAG"

      - name: Check tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "::error::$RELEASE_TAG is not an ancestor of main; release tags must be created on main"
            exit 1
          fi

  preflight:
    name: Determine platforms
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Decide platform list
        id: platforms
        env:
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          # GitHub Releases get an installable APK; the AAB is only built when the
          # Google Play service account is configured, since that is its only use.
          platforms='["windows","linux","macos","android","ios"'
          if [ "$HAS_PLAY" = "true" ]; then
            platforms="$platforms"',"android-aab"'
          fi
          echo "platforms=$platforms]" >> "$GITHUB_OUTPUT"

  build:
    name: Build release artifacts
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      platforms: ${{ needs.preflight.outputs.platforms }}
      ref: ${{ inputs.tag || github.ref }}
      sign: true
      package: true
    secrets: inherit

  create-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp artifacts/windows-release/relay-windows.zip "release-assets/relay-${VERSION}-windows-x64.zip"
          cp artifacts/linux-release/relay-linux.tar.gz "release-assets/relay-${VERSION}-linux-x64.tar.gz"
          cp artifacts/macos-release/relay-macos.zip "release-assets/relay-${VERSION}-macos.zip"
          cp artifacts/android-apk-release/relay-android.apk "release-assets/relay-${VERSION}-android.apk"
          cp artifacts/ios-release/relay-ios-unsigned.zip "release-assets/relay-${VERSION}-ios-unsigned.zip"

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum relay-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/relay-*

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
          draft: true

  publish-release:
    name: Publish release
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  play-upload:
    name: Upload to Google Play (internal)
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check release signing prerequisites
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true' && env.HAS_ANDROID_KEYSTORE != 'true'
        run: |
          echo "::error::PLAY_SERVICE_ACCOUNT_JSON is configured but ANDROID_KEYSTORE_BASE64 is not; the AAB would be debug-signed and rejected by Google Play."
          exit 1

      - name: Download AAB
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-aab-release
          path: android

      - name: Upload to Google Play internal track
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.devora.relay
          releaseFiles: android/relay-android.aab
          track: internal
          status: completed

  ios-testflight:
    name: Upload to TestFlight
    needs: publish-release
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_IOS_SIGNING: ${{ secrets.MATCH_GIT_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Note skipped upload
        if: env.HAS_IOS_SIGNING != 'true'
        run: echo "::notice::MATCH_GIT_URL is not configured; skipping the TestFlight upload."

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: env.HAS_IOS_SIGNING == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: ./.github/actions/setup-flutter
        if: env.HAS_IOS_SIGNING == 'true'

      - name: Build and upload to TestFlight
        if: env.HAS_IOS_SIGNING == 'true'
        working-directory: ios
        env:
          CI: "true"
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_USERNAME: ${{ secrets.MATCH_USERNAME }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: bundle exec fastlane beta
