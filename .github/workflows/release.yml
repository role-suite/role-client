name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and publish, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-version:
    name: Verify tag matches pubspec and main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter

      - name: Check tag against pubspec.yaml
        run: dart run tool/version.dart validate --tag "$RELEASE_TAG"

      - name: Check tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "::error::$RELEASE_TAG is not an ancestor of main; release tags must be created on main"
            exit 1
          fi

  build:
    name: Build release artifacts
    needs: verify-version
    uses: ./.github/workflows/build.yml
    with:
      platforms: '["windows","linux"]'
      sign: true
      package: true
    secrets: inherit

  create-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp artifacts/windows-release/relay-windows.zip "release-assets/relay-${VERSION}-windows-x64.zip"
          cp artifacts/linux-release/relay-linux.tar.gz "release-assets/relay-${VERSION}-linux-x64.tar.gz"

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum relay-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/relay-*

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
          draft: true

  publish-release:
    name: Publish release
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false
