name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-version:
    name: Verify tag matches pubspec version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag against pubspec.yaml
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PUBSPEC_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match pubspec.yaml version ${PUBSPEC_VERSION} — bump pubspec.yaml or push the correct tag"
            exit 1
          fi

  macos:
    name: macOS (signed + notarized if certificate present)
    runs-on: macos-latest
    needs: verify-version
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-flutter

      - name: Import signing certificate
        if: env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build macOS app
        run: flutter build macos --release

      - name: Verify universal binary
        run: lipo -info "build/macos/Build/Products/Release/relay.app/Contents/MacOS/relay" | grep -q "x86_64 arm64"

      - name: Codesign app
        if: env.HAS_MACOS_CERT == 'true'
        run: |
          codesign --deep --force --options runtime \
            --sign "${{ secrets.MACOS_CERTIFICATE_IDENTITY }}" \
            "build/macos/Build/Products/Release/relay.app"

      - name: Zip app
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/relay.app" relay-macos.zip

      - name: Notarize
        if: env.HAS_MACOS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit relay-macos.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "build/macos/Build/Products/Release/relay.app"

      - name: Re-zip stapled app
        if: env.HAS_MACOS_CERT == 'true'
        run: |
          rm relay-macos.zip
          ditto -c -k --keepParent "build/macos/Build/Products/Release/relay.app" relay-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: relay-macos.zip
          retention-days: 7

  windows:
    name: Windows (signed if certificate present)
    runs-on: windows-latest
    needs: verify-version
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-flutter

      - name: Build Windows app
        run: flutter build windows --release

      - name: Sign executable
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          & $signtool sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "build\windows\x64\runner\Release\relay.exe"
          Remove-Item certificate.pfx

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath relay-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: relay-windows.zip
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: ./.github/actions/setup-flutter

      - name: Build Linux app
        run: flutter build linux --release

      - name: Package build
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/relay
          tar -czf relay-linux.tar.gz -C build/linux/x64/release relay

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: relay-linux.tar.gz
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp artifacts/macos-release/relay-macos.zip "release-assets/relay-${VERSION}-macos.zip"
          cp artifacts/windows-release/relay-windows.zip "release-assets/relay-${VERSION}-windows-x64.zip"
          cp artifacts/linux-release/relay-linux.tar.gz "release-assets/relay-${VERSION}-linux-x64.tar.gz"

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum relay-* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
